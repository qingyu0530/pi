[workspace]
members = [
    "crates/pi-agent-core",
    "crates/pi-ai",
    "crates/pi-coding-agent",
    "crates/pi-tui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/earendil-works/pi-mono"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
ureq = { version = "=3.4.1", default-features = false, features = ["rustls", "gzip"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
