[workspace]
members = [
    "crates/pi-agent-core",
    "crates/pi-ai",
    "crates/pi-coding-agent",
    "crates/pi-tui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/earendil-works/pi-mono"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
